<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070912"><meta name="description" content="Sign in to FINISHER EMPIRE">
  <title>FINISHER EMPIRE | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas><div class="glow pink"></div><div class="glow blue"></div>
  <main class="shell">
    <a class="brand" href="index.html"><span class="mark">F<span>✦</span></span><span>FINISHER <b>EMPIRE</b></span></a>
    <section class="panel">
      <div class="eyebrow"><i></i> WELCOME TO FINISHER EMPIRE</div>
      <div class="mode-tabs" role="group" aria-label="Choose sign in or sign up">
        <button type="button" class="mode-tab active" id="signin-tab">SIGN IN</button>
        <button type="button" class="mode-tab" id="signup-tab">SIGN UP</button>
      </div>
      <h1 id="form-title">ENTER THE <span>EMPIRE</span></h1>
      <p class="intro" id="form-subtitle">Sign in to continue to Finisher Community.</p>
      <form id="auth-form">
        <label for="name" id="name-label" hidden>Display name</label>
        <input id="name" type="text" autocomplete="nickname" placeholder="Your display name" hidden>
        <label for="email">EMAIL ADDRESS</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">PASSWORD</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required>
        <button class="primary" id="submit-btn" type="submit">SIGN IN <span>↗</span></button>
      </form>
      <button class="google" id="google-btn" type="button"><span class="google-g">G</span> CONTINUE WITH GOOGLE</button>
      <button class="text-btn" id="forgot-btn" type="button">Forgot password?</button>
      <p class="switch-line"><span id="switch-prompt">New to the Empire?</span> <button id="switch-btn" class="text-btn" type="button">Create account</button></p>
      <div class="guest-divider"><span>OR</span></div>
      <a class="guest-btn" href="home.html">CONTINUE WITHOUT LOGIN <span>→</span></a>
      <p class="guest-note">You can browse as a guest. Sign in only if you want an account.</p>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <p class="fine-print">STAY SILENT • STAY SAFE</p>
    </section>
    <footer>© <span id="year"></span> FINISHER EMPIRE. ALL RIGHTS RESERVED.</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script type="module" src="login.js"></script>
</body></html>
